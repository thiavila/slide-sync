<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1><img class="brand-logo" src="../icons/logo.png" alt="slidesync" /></h1>

    <div id="inactive-view">
      <div class="status disconnected">
        <span class="dot"></span>
        <span id="no-active-session"></span>
      </div>
      <p class="hint" id="open-presentation-hint"></p>
    </div>

    <div id="active-view" class="hidden">
      <div class="status connected">
        <span class="dot"></span>
        <span id="active-session"></span>
      </div>
      <div class="room-code">
        <div class="label" id="room-code-label"></div>
        <div class="code" id="roomCode">------</div>
        <button id="copy-code" type="button"></button>
        <span id="copy-status" role="status"></span>
      </div>
      <div class="info-row">
        <span class="label" id="current-slide-label"></span>
        <span id="currentSlide" class="value">-</span>
      </div>
    </div>
  </div>
  <footer class="popup-footer"><span>slidesync</span><a id="open-website" href="https://slidesync.live" target="_blank" rel="noopener noreferrer"></a></footer>
  <script src="popup.js"></script>
</body>
</html>
